id: erp/finance                      # 必须与 component.yaml 一致，be-ops 校验

domain: erp
tier: backend

edge_routes:
  - { path: /erp/finance/**, auth: required }

menus:
  - { key: erp.finance, title: 财务管理, permission: erp.finance.view }

data:
  schema: erp_finance                 # registry/schemas.tsv
  role:   erp_finance_rw              # 登录角色，`PG_USER` 的值

data_scopes:
  - { dimension: legal_entity, column: legal_entity_id, mode: in,
      tables: [finance_journal_entries, finance_journal_entry_lines, ar_ledger, ap_ledger] }

permissions:
  - { key: erp.finance.view,           title: 查看财务数据,         type: page   }
  - { key: erp.finance.post,           title: 手工过账/冲销,        type: action }
  - { key: erp.finance.close,          title: 关账/反关账/锁定期间, type: action }
  - { key: erp.finance.manage_access,  title: 分配法人访问权限,     type: action }
