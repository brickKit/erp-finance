id: erp/finance                      # 必须与 component.yaml 一致，be-ops 校验
version: 1.0.0

asset:
  source_type: open_standard
  assembly_role: default
  contract_lock: strict
  customization_guide: |
    会计科目表、期间策略或凭证规则超出标准版时：
    1. 主管理员在客户电脑本地复制本目录为定制目录（如 erp-finance-acme），改 git remote。
    2. 用 AI 在 backend/ 生成定制业务代码。
    3. 严禁对 contracts/ 做破坏性变更；只允许在末尾追加新字段、使用新 Tag 编号——
       下游 erp-sales 消费这份契约（§3.4 铁律 3）。
    4. 把定制目录声明成 local 安装源并排在标准源前面（§3.4.1 遮蔽机制）。
    ⚠️ metadata.id 与 version 一个字都不能改——改了所有依赖方的
       ERP_FINANCE_ENDPOINT 会整个消失。

domain: erp
tier: backend

edge_routes:
  - { path: /erp/finance/**, auth: required }

menus:
  - { key: erp.finance, title: 财务管理, permission: erp.finance.view }

data:
  schema: erp_finance                 # registry/schemas.tsv
  role:   erp_finance_rw              # 只用于 SET LOCAL ROLE，从不登录，因此不进 brickkit.yaml

# legal_entity 维（设计计划 §1、设计书 §14.2.2）：多公司集团的客户里，
# 法人 A 的会计不该看到法人 B 的账。⚠️ 阶段二只有一个默认法人，过滤逻辑
# 到阶段三才实现，但列必须现在就建——分区表回头加列的代价比建表时多
# 两个数量级（§11.2.1）。
data_scopes:
  - { dimension: legal_entity, column: legal_entity_id, mode: in,
      tables: [finance_journal_entries, finance_journal_entry_lines, ar_ledger, ap_ledger] }

permissions:
  - { key: erp.finance.view,           title: 查看财务数据,         type: page   }
  - { key: erp.finance.post,           title: 手工过账/冲销,        type: action }
  - { key: erp.finance.close,          title: 关账/反关账/锁定期间, type: action }
  - { key: erp.finance.manage_access,  title: 分配法人访问权限,     type: action }

shell: go-core                       # 合并部署时进外壳一（§13.2）
