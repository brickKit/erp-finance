apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/finance                    # ⚠️ Fork 件必须与标准件完全一致（§3.4.1）
  name: 财务管理
  version: 1.0.6                     # 精确版本，不接受 ^ / ~ / latest
                                      # v1.0.6：新增 make seed（从零设计，AGENTS.md 原文点名
                                      # "几乎没有专属演示数据"）——5 张 PostManualEntry 人工
                                      # 凭证（覆盖 5 个科目 + 单行/四行多行 + 待冲销样例真做
                                      # 一次 ReverseEntry）+ 期间三态生命周期演示（close→lock
                                      # 终态、close→reopen 往返、只 close）+
                                      # legal_entity_access 授权 dev.superuser/
                                      # dev.finance.viewer（同 erp-inventory 的
                                      # warehouse_access 判据）；新增 make db-reset（同
                                      # erp-inventory：entry_no_seq/post_no 计数器"只增不
                                      # 回退" + LockPeriod 是契约里唯一的终态，逐行 DELETE
                                      # 做不到干净复原，只能整库重置）。旁路修复一个真实
                                      # bug：003_seed_accounts_and_periods.down.sql 的 DELETE
                                      # 在 migrate down 倒序执行时会撞
                                      # finance_journal_entries 的外键（同 erp-inventory
                                      # 003_seed_warehouses.down.sql 踩过的坑），真机跑
                                      # db-reset 前已按同一模式预先改成空文件，随后真机验证
                                      # db-reset 一次成功，记入踩坑记录 C23。无破坏性变更。
                                      # v1.0.5：docs/手册.md 的 TEST_PG_DSN 示例改指向
                                      # brickkit_test_db，纯文档，无行为/契约变更
                                      # v1.0.4：补 ListEntries 的真实跨法人排除测试
                                      # （TestListEntries_看不到别的法人的凭证）——
                                      # 过程中发现一个真实但当前不可触发的设计缺口
                                      # （post_no 不含 legal_entity_id 但按
                                      # (period,legal_entity_id) 独立计数，两个法人
                                      # 同期间各自首次过账会撞同一个 post_no，记入
                                      # 踩坑记录 C17，未改产品代码）。纯补测试，无
                                      # 行为/契约变更。
                                      # v1.0.2：纯 Makefile 门禁加固（check-version
                                      # 新增 deployment.image 与 version 一致性判据，
                                      # 阶段三 Task 4 发现其余四个组件的这条真的分叉过）
  description: 会计科目表、总账分录、应收/应付台账、会计期间锁、对账——事件汇枢纽
  license: Apache-2.0
  vendor: brickKit

tags: [erp, finance, accounting]

artifacts:
  - type: api-contract
    format: protobuf
    files:
      - contracts/erp/finance/v1/finance.proto
      - contracts/events/finance.events.json
  - type: api-contract
    format: openapi
    files: [contracts/finance.openapi.yaml]
  - type: metadata                   # ← assembly.yaml 靠这一条随组件分发（§3.5）
    files: [assembly.yaml]

dependencies:
  components: []                     # ⚠️ 本组件是事件汇枢纽，零出边（设计计划 §5、§6）。
                                      # 只消费事件（erp-sales/erp-inventory/mdm-customer），
                                      # 不建任何同步依赖边
  resources:
    # ⚠️ engine 逐字参与匹配（设计书 §2.7.3.1）：这里写的词必须与
    #    brickkit.yaml 的 resources[].engine 完全相同，平台不认别名。
    - { kind: database, engine: postgresql }   # 产品名：不在替换范围
    - { kind: mq,       engine: nats }         # 产品名：换 Kafka 是一次迁移，要让平台阻断

configSchema:
  type: object
  properties:
    pgSchema:                        # ⚠️ 不能叫 databaseSchema，DATABASE_ 是保留前缀
      type: string
      default: erp_finance
    iamJwksUrl:                      # JWT 本地验签的公钥来源。不对 IAM 建依赖边（决策 87）
      type: string
    authzBundleUrl:                  # 阶段三 Task 6：功能权限判定的 bundle 轮询地址，
                                      # 指向 infra-authz。不建依赖边（同 iamJwksUrl 的
                                      # 判据，设计书 §14.1.4）
      type: string
    otelBaseUrl:                     # ⚠️ 不能叫 otelEndpoint，*_ENDPOINT 是保留后缀
      type: string
      default: ""                    # 空 → Blackhole Exporter，零成本（§7.5）

deployment:
  type: container
  image: brickenterprise/erp-finance:1.0.6
  port: 8087                         # 端口册 registry/ports.tsv
  extraPorts:
    - { name: grpc, port: 9097 }     # → ERP_FINANCE_GRPC_ENDPOINT（值仍以 http:// 开头）
  labels:                            # 平台只搬运，不解释键值。值必须是字符串
    prometheus.io/scrape: "true"
    prometheus.io/port: "8087"
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "150m", memory: "192Mi" }

migration:
  command: ["./migrate", "up"]

healthCheck:
  type: http
  path: /healthz                     # ⚠️ 只查本进程存活，严禁查库或查依赖组件（§12.3.6）
  # startPeriodSeconds 不写：默认就是 60，Go 组件够用（§12.3.5）
