  description: 会计科目表、总账分录、应收/应付台账、会计期间锁、对账——事件汇枢纽
  license: Apache-2.0
  vendor: brickKit

tags: [erp, finance, accounting]

artifacts:
  - type: api-contract
    format: protobuf
    files:
      - contracts/erp/finance/v1/finance.proto
      - contracts/events/finance.events.json
  - type: api-contract
    format: openapi
    files: [contracts/finance.openapi.yaml]
  - type: metadata                   # ← assembly.yaml 靠这一条随组件分发（§3.5）
    files: [assembly.yaml]

dependencies:
  components: []                     # ⚠️ 本组件是事件汇枢纽，零出边（设计计划 §5、§6）。
                                      # 只消费事件（erp-sales/erp-inventory/mdm-customer），
                                      # 不建任何同步依赖边
  resources:
    # ⚠️ engine 逐字参与匹配（设计书 §2.7.3.1）：这里写的词必须与
    #    brickkit.yaml 的 resources[].engine 完全相同，平台不认别名。
    - { kind: database, engine: postgresql }   # 产品名：不在替换范围
    - { kind: mq,       engine: nats }         # 产品名：换 Kafka 是一次迁移，要让平台阻断

configSchema:
  type: object
  properties:
    pgSchema:                        # ⚠️ 不能叫 databaseSchema，DATABASE_ 是保留前缀
      type: string
      default: erp_finance
    iamJwksUrl:                      # JWT 本地验签的公钥来源。不对 IAM 建依赖边（决策 87）
      type: string
    authzBundleUrl:                  # 阶段三 Task 6：功能权限判定的 bundle 轮询地址，
                                      # 指向 infra-authz。不建依赖边（同 iamJwksUrl 的
                                      # 判据，设计书 §14.1.4）
      type: string
    otelBaseUrl:                     # ⚠️ 不能叫 otelEndpoint，*_ENDPOINT 是保留后缀
      type: string
      default: ""                    # 空 → Blackhole Exporter，零成本（§7.5）

deployment:
  type: container
  image: brickenterprise/erp-finance:1.0.10
  port: 8087                         # 端口册 registry/ports.tsv
  extraPorts:
    - { name: grpc, port: 9097 }     # → ERP_FINANCE_GRPC_ENDPOINT（值仍以 http:// 开头）
  labels:                            # 平台只搬运，不解释键值。值必须是字符串
    prometheus.io/scrape: "true"
    prometheus.io/port: "8087"
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "150m", memory: "192Mi" }

migration:
  command: ["./migrate", "up"]

healthCheck:
  type: http
  path: /healthz                     # ⚠️ 只查本进程存活，严禁查库或查依赖组件（§12.3.6）
  # startPeriodSeconds 不写：默认就是 60，Go 组件够用（§12.3.5）
