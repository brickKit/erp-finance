apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/finance
  name: Finance
  version: 2.0.0
  description: Chart of accounts, general ledger entries, receivable and payable ledgers, period locks and reconciliation.
  repository: https://github.com/brickKit/erp-finance
  license: Apache-2.0
  vendor: brickKit

tags: [erp, finance, accounting]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/erp/finance/v1/finance.proto, contracts/events/finance.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/finance.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: erp_finance}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8087
  extraPorts:
    - {name: grpc, port: 9097}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 150m, memory: 192Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
