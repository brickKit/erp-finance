apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/finance
  name: Finance
  version: 3.0.12
  description: "One ledger per legal entity: the chart of accounts, posting rules, periods and vouchers; receivables from issued invoices, payables from supplier invoices matched against purchase orders, the payment claims erp/payment makes and the settlement of its fund facts; the shared accounting fact contract the sources publish under (protocol 05)"
  repository: https://github.com/brickKit/erp-finance

dependencies:
  components:
    - mdm/currency@3.0.36
    - mdm/org@3.0.38
    - mdm/partner@3.0.43
    - id: erp/purchase@3.0.10
      optional: true

events:
  publishes:
    - erp.accounting_period.changed.v1
    - erp.open_item.settled.v1
    - erp.receivable.cleared.v1
    - erp.receivable.formed.v1
    - erp.receivable.reduced.v1
    - erp.receivable.reopened.v1
    - erp.supplier_invoice.price_confirmed.v1
    - erp.supplier_invoice.price_reversed.v1
    - erp.voucher.posted.v1
  subscribes:
    - erp.invoice.issued.v1
    - mdm.org_unit.changed.v1

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8087
  extraPorts:
    - name: grpc
      port: 9097
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/erp-finance", "migrate"]

local:
  runCommand: [go, run, .]
  migrationCommand: [go, run, ., migrate]

configSchema:
  properties:
    AUDIT_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    AUTHZ_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    BUS_SUBSCRIPTION_CONCURRENCY:
      type: integer
    BUS_URL:
      description: 'process-level: the same for every member of a shell'
      secret: true
      type: string
    CLAIM_PERIOD:
      description: 'a pending payment claim''s period (protocol 05''s start value 7 days); unset: 7 days; a duration (e.g. 2s, 500ms)'
      type: string
    DEPLOYMENT_ID:
      description: 'process-level: the same for every member of a shell'
      type: string
    FINANCE_FACT_SOURCES:
      description: 'the accounting and fund facts subscribed to: JSON, [{stream, type}], each type ending in .fund_fact.v1 or .accounting_fact.v1, as the assembly''s sources publish them; unset: none'
      type: string
    IAM_ISSUER:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_JWKS_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    IMPLEMENTATION_INSTANCE:
      type: string
    LOG_LEVEL:
      description: SDK default info
      enum:
        - debug
        - info
        - warn
        - error
      type: string
    MATCH_TOLERANCES:
      description: 'the supplier invoice matching''s tolerances per legal entity (JSON: legal entity ID -> {quantity_percent, price_percent}, decimal strings); a legal entity not named has 0'
      type: string
    OBJECT_STORE_ACCESS_KEY:
      type: string
    OBJECT_STORE_BUCKET:
      type: string
    OBJECT_STORE_PREFIX:
      type: string
    OBJECT_STORE_REGION:
      description: SDK default us-east-1
      type: string
    OBJECT_STORE_SECRET_KEY:
      secret: true
      type: string
    OBJECT_STORE_URL:
      type: string
    OTEL_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    PG_DATABASE:
      type: string
    PG_HOST:
      type: string
    PG_IDLE_IN_TX_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 10s
      type: string
    PG_LOCK_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_PASSWORD:
      secret: true
      type: string
    PG_OWNER_USER:
      type: string
    PG_PASSWORD:
      secret: true
      type: string
    PG_POOL_BACKGROUND:
      description: SDK default 4
      type: integer
    PG_POOL_FOREGROUND:
      description: SDK default 8
      type: integer
    PG_POOLER_PREPARED:
      description: SDK default true
      type: boolean
    PG_PORT:
      description: SDK default 5432
      type: integer
    PG_SCHEMA:
      type: string
    PG_STATEMENT_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 5s
      type: string
    PG_USER:
      type: string
    RECOVERY_PHASE:
      description: 'process-level: the same for every member of a shell'
      enum:
        - frozen
        - redelivering
        - replaying
        - verifying
        - read_only
      type: string
    SERVICE_TLS_CA_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_CERT_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_KEY_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    STOP_DRAIN_DELAY:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    STOP_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 30s
      type: string
  required:
    - BUS_URL
    - IMPLEMENTATION_INSTANCE
    - PG_DATABASE
    - PG_HOST
    - PG_PASSWORD
    - PG_SCHEMA
    - PG_USER
  type: object

release:
  goModule: true
