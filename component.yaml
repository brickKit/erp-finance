                                      # 的 bug，无行为/契约变更。
                                      # v1.0.7：补齐 README.md 的"怎么起来"/"怎么用"/
                                      # "配置项"三节——建仓库时留的占位符一直没人回来
                                      # 填，`make docs-check` 的占位符检测正则同时修正
                                      # （原来只查 TBD/TODO/待补，没覆盖实际用的"后补"
                                      # 措辞）。纯文档，无行为/契约变更。
                                      # v1.0.6：新增 make seed（从零设计，AGENTS.md 原文点名
