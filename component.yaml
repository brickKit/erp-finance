                                      # integration-im-dingtalk 同一批补齐（field-tested-
                                      # pitfalls-log.md 类别 E 的 E2）。纯测试基础设施修复，
                                      # 无行为/契约变更。
                                      # v1.0.8：补 TestProperty_借贷不平衡的分录被拒绝且
                                      # 不落库/TestProperty_PostManualEntry并发同key仅
                                      # 执行一次——04-testing-standard.md §3.2 对"核心
                                      # 交易类组件"的强制要求（L2 必须用属性测试，例子
                                      # 测试不够），全项目系统排查测试完整性时发现三个
                                      # 核心交易类组件（本组件/erp-inventory/erp-sales）
