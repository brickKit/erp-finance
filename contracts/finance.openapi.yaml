openapi: 3.0.3
info:
  title: erp-finance · 财务管理
  version: 1.0.0
  description: |
    对外 REST 面。内部 gRPC，外部 HTTP（§2.1）。
    ⚠️ 不暴露 CheckPeriodOpen/BatchGetCreditExposure——前者是组件间期间锁
    的咨询性入口，后者是给其他组件 gRPC 客户端防 N+1 用的批量读优化
    （设计计划 §3）。

servers:
  - url: /erp/finance

# ⚠️ /healthz 不在这份契约里：be-sdk-go 的 NewGinEngine 给每个组件统一挂的，
# 路径固定是裸根路径 /healthz（§12.3.6）。

paths:
  /periods/{period}/close:
    post:
      summary: ClosePeriod（关账，可逆）
      operationId: closeFinancePeriod
      parameters:
        - { name: period, in: path, required: true, schema: { type: string }, description: 格式 YYYY-MM }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodOpRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodOpResponse" }

  /periods/{period}/reopen:
    post:
      summary: ReopenPeriod（反关账）
      operationId: reopenFinancePeriod
      parameters:
        - { name: period, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodOpRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodOpResponse" }

  /periods/{period}/lock:
    post:
      summary: LockPeriod（锁定，不可逆）
      operationId: lockFinancePeriod
      parameters:
        - { name: period, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodOpRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodOpResponse" }

  /credit-exposure/{customer_id}:
    get:
      summary: GetCreditExposure
      operationId: getCreditExposure
      parameters:
        - { name: customer_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditExposure" }

  /entries:
    get:
      summary: ListEntries
      operationId: listFinanceEntries
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: 游标分页（决策 53），无 offset 参数——深分页在契约层面不可表达
        - name: page_size
          in: query
          schema: { type: integer }
        - name: period
          in: query
          schema: { type: string }
        - name: status_filter
          in: query
          schema: { $ref: "#/components/schemas/EntryStatus" }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: 不传时间范围时框架层自动注入最近 90 天（§11.4.1）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/JournalEntry" }
                  next_cursor: { type: string }
    post:
      summary: PostManualEntry（手工凭证，自动凭证走事件消费不走这里）
      operationId: postManualFinanceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostManualEntryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /entries/{id}:
    get:
      summary: GetEntry
      operationId: getFinanceEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /entries/{id}/reverse:
    post:
      summary: ReverseEntry（红字冲销，不是删除；返回新产生的反向凭证）
      operationId: reverseFinanceEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseEntryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /ar-ledger:
    get:
      summary: ListARLedger
      operationId: listARLedger
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: customer_id
          in: query
          schema: { type: string }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/ARLedgerEntry" }
                  next_cursor: { type: string }

components:
  schemas:
    PeriodStatus:
      type: string
      enum: [OPEN, CLOSED, LOCKED]

    EntryStatus:
      type: string
      enum: [DRAFT, POSTED]

    PeriodOpRequest:
      type: object
      required: [idempotency_key, legal_entity_id]
      properties:
        idempotency_key: { type: string }
        legal_entity_id: { type: string }

    PeriodOpResponse:
      type: object
      properties:
        status: { $ref: "#/components/schemas/PeriodStatus" }

    CreditExposure:
      type: object
      properties:
        customer_id: { type: string }
        exposure:
          type: string
          description: 金额一律用 string 传 decimal，绝不用 double（跨语言精度）
        version: { type: integer, format: int64 }

    JournalEntryLine:
      type: object
      required: [account_id, debit, credit]
      properties:
        account_id: { type: string }
        debit: { type: string }
        credit: { type: string }
        memo: { type: string }

    JournalEntry:
      type: object
      properties:
        id: { type: string }
        entry_no: { type: string }
        post_no: { type: string, description: 空字符串表示还未过账 }
        period: { type: string }
        legal_entity_id: { type: string }
        status: { $ref: "#/components/schemas/EntryStatus" }
        source_component: { type: string }
        source_doc_type: { type: string }
        source_doc_id: { type: string }
        source_revision: { type: integer, format: int64 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalEntryLine" }
        memo: { type: string }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        posted_at: { type: string, format: date-time }

    PostManualEntryRequest:
      type: object
      required: [idempotency_key, legal_entity_id, lines]
      properties:
        idempotency_key:
          type: string
          description: 跨重试幂等键（§4.6），被调用方用唯一约束去重
        legal_entity_id: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalEntryLine" }
        memo: { type: string }

    ReverseEntryRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string }
        reason: { type: string }

    ARLedgerEntry:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        entry_id: { type: string }
        amount: { type: string }
        reconciled_amount: { type: string }
        created_at: { type: string, format: date-time }
